services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mercadoapp
      SPRING_DATASOURCE_USERNAME: ${USERNAME_DEV}
      SPRING_DATASOURCE_PASSWORD: ${PASSWORD_DEV}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:alpine
    environment:
      POSTGRES_DB: mercadoapp
      POSTGRES_USER: ${USERNAME_DEV}
      POSTGRES_PASSWORD: ${PASSWORD_DEV}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
