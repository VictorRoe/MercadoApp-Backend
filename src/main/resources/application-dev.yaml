app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

spring:
  application:
    name: mercadoapp

  # Configuración por defecto (H2)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 12345
  sql:
    init:
      mode: never

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: 'create-drop'
    show-sql: true
  h2:
    console:
      enabled: true